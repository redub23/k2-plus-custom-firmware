name: Automated Upstream Sync

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/KennethDoerflein/k2-plus-custom-firmware.git || git remote set-url upstream https://github.com/KennethDoerflein/k2-plus-custom-firmware.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Already up to date with upstream/main."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New upstream commits found."
          fi

      - name: Perform Safe Sync
        if: steps.check.outputs.has_changes == 'true'
        id: sync
        run: |
          # Run sync script with auto-commit
          if python scripts/sync_upstream.py --commit; then
            echo "sync_status=clean" >> $GITHUB_OUTPUT
          else
            echo "sync_status=conflicts" >> $GITHUB_OUTPUT
            # If conflicts occurred, stage remaining conflict markers so they are visible in PR
            git add -A
            git commit -m "chore(upstream): merge upstream with conflict markers for review" || true
          fi

      - name: Create or Update Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated-upstream-sync
          title: "chore(upstream): automated sync with upstream KennethDoerflein/k2-plus-custom-firmware"
          commit-message: "chore(upstream): sync changes from KennethDoerflein/k2-plus-custom-firmware"
          body: |
            ## Automated Upstream Sync

            New commits were detected and pulled from `upstream/main` (`KennethDoerflein/k2-plus-custom-firmware`).

            ### Status: ${{ steps.sync.outputs.sync_status == 'clean' && '✅ Clean Merge (Tests Passed)' || '⚠️ Conflicts Detected (Review Required)' }}

            - **Checksum files**: Automatically verified and regenerated via `scripts/release_index.py`.
            - **Compatibility tests**: Executed via `tests/test_compat.py`.

            ${{ steps.sync.outputs.sync_status == 'clean' && 'All checks passed cleanly. This PR is ready to merge.' || 'Please review conflicting files flagged in this PR before merging.' }}

            ### After merging
            On the printer after merging: `bootstrap --update` (bootstrap and Kalico extras).
            If Klipper halts after an update, revert this merge on GitHub and run the same command again.
          labels: |
            upstream-sync
            automated
